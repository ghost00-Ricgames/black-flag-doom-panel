name: Validate and Package Foundry Module

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'development/**'
      - 'feature/**'
      - 'fix/**'
      - 'maintenance/**'
  workflow_dispatch:
  release:
    types: [published]

# PRs and routine development builds cannot publish or write to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Run tests and assemble installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source or release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Validate JavaScript and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/main.mjs
          for test_file in tests/*.mjs; do
            node "$test_file"
          done

      - name: Verify release tag and manifest version agree
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const m = JSON.parse(readFileSync("module.json", "utf8"));
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.REPOSITORY;
          assert.match(m.version, /^\d+\.\d+\.\d+$/, "GitHub Releases must use stable versions");
          assert.equal(tag, "v" + m.version, "Release tag must match packaged manifest version");
          assert.equal(m.manifest, `https://raw.githubusercontent.com/${repo}/main/module.json`);
          assert.equal(m.download,
            `https://github.com/${repo}/releases/download/${tag}/black-flag-doom-panel.zip`);
          NODE

      - name: Assemble root-flat Foundry installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -r dist/black-flag-doom-panel.zip \
            module.json scripts/main.mjs \
            templates/doom-panel.html templates/doom-overlay.html \
            styles/style.css styles/app-v2-overlay.css \
            styles/milestone2.css styles/milestone3.css styles/compact-panel.css \
            lang/en.json LICENSE THIRD-PARTY-NOTICES.md
          unzip -t dist/black-flag-doom-panel.zip
          for required in module.json LICENSE THIRD-PARTY-NOTICES.md; do
            unzip -Z1 dist/black-flag-doom-panel.zip | grep -qx "$required"
          done
          test "$(unzip -Z1 dist/black-flag-doom-panel.zip | wc -l)" -eq 12

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-flag-doom-panel-archive
          path: dist/black-flag-doom-panel.zip

  attach_release:
    name: Attach tested installer to approved GitHub Release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified ZIP
        uses: actions/download-artifact@v4
        with:
          name: black-flag-doom-panel-archive
          path: dist
      - name: Attach ZIP to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/black-flag-doom-panel.zip
          fail_on_unmatched_files: true
