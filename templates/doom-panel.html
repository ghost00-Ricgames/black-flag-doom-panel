<div class="doom-panel-container">
    <div class="doom-section encounter-stats">
        <div class="stat-row"><span><i class="fas fa-users-slash"></i> Adversaries:</span><span class="stat-val">{{adversaryCount}}</span></div>
        <div class="stat-row"><span><i class="fas fa-crown"></i> Max CR:</span><span class="stat-val">{{maxCR}}</span></div>
    </div>
    <hr>
    <div class="doom-section doom-bank">
        <label for="manual-doom-input">Current Doom</label>
        <div class="doom-value-display"><input type="number" id="manual-doom-input" min="0" step="1" value="{{doom}}" {{#unless canEdit}}disabled{{/unless}}></div>
        {{#unless canEdit}}<p class="doom-readonly-note">The active GM controls Doom.</p>{{/unless}}
    </div>
    <hr>
    <div class="doom-section gain-section">
        <h3>Generate Doom</h3>
        <div class="btn-column">
            <button type="button" data-action="gainDoom" data-type="pc1" {{#unless canEdit}}disabled{{/unless}}><i class="fas fa-dice-one"></i> PC Natural 1</button>
            <button type="button" data-action="gainDoom" data-type="npc20" {{#unless canEdit}}disabled{{/unless}}><i class="fas fa-dice-d20"></i> NPC Natural 20</button>
            <button type="button" data-action="gainDoom" data-type="manual" {{#unless canEdit}}disabled{{/unless}}><i class="fas fa-plus"></i> Manual +1</button>
        </div>
    </div>
    <hr>
    <div class="doom-section spend-section">
        <h3>Spend Doom</h3>
        <div class="btn-grid">
            <button type="button" data-action="spendDoom" data-cost="1" {{#unless canEdit}}disabled{{/unless}}><i class="fas fa-angle-double-up"></i> ADV (1)</button>
            <button type="button" data-action="spendDoom" data-cost="1" {{#unless canEdit}}disabled{{/unless}}><i class="fas fa-angle-double-down"></i> DIS (1)</button>
            <button type="button" data-action="spendDoom" data-cost="2" {{#unless canEdit}}disabled{{/unless}}><i class="fas fa-bolt"></i> ACT (2)</button>
            <button type="button" data-action="spendDoom" data-cost="3" {{#unless canEdit}}disabled{{/unless}}><i class="fas fa-sync-alt"></i> RCH (3)</button>
        </div>
        <div class="custom-spend-row">
            <input type="number" id="custom-spend-val" value="1" min="1" step="1" aria-label="Custom Doom spend amount" {{#unless canEdit}}disabled{{/unless}}>
            <button type="button" data-action="spendDoom" class="custom-btn" {{#unless canEdit}}disabled{{/unless}}>Spend</button>
        </div>
    </div>
</div>
